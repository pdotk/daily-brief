name: Work Recap

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days to include"
        required: false
        default: "14"

  # Runs every Friday at 8pm UTC.
  # Remove this schedule if you only want manual recaps.
  schedule:
    - cron: '0 20 * * 5'

jobs:
  send-work-recap:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run work recap
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_KEY: ${{ secrets.LINEAR_TEAM_KEY }}

          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          SLACK_CHANNELS: ${{ secrets.SLACK_CHANNELS }}
          SAVE_EMOJI: ${{ secrets.SAVE_EMOJI }}

          GOOGLE_CALENDAR_CREDENTIALS: ${{ secrets.GOOGLE_CALENDAR_CREDENTIALS }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RECAP_MODEL: ${{ secrets.RECAP_MODEL }}

        run: |
          DAYS="${{ github.event.inputs.days }}"
          if [ -z "$DAYS" ]; then DAYS="14"; fi
          python daily_brief.py recap --days "$DAYS"
